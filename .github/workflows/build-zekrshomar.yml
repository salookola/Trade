name: Build ZekrShomar APK

on:
  push:
    branches:
      - build/zekrshomar-apk-20260629
  pull_request:
    branches:
      - main
    paths:
      - 'zekrshomar/**'
      - '.github/workflows/build-zekrshomar.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zekrshomar
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK and capture log
        id: build
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:assembleDebug > build.log 2>&1
          status=$?
          tail -n 250 build.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZekrShomar-build-log
          path: zekrshomar/build.log
          if-no-files-found: error
      - name: Upload APK
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: ZekrShomar-v1.0.1-debug-apk
          path: zekrshomar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Fail if build failed
        if: steps.build.outputs.status != '0'
        run: exit 1
